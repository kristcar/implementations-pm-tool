{% extends "base.html" %}
{% block title %}New Project — Implementations PM{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h4 class="fw-bold mb-4"><i class="bi bi-plus-circle me-2"></i>New Project</h4>

    <form method="POST" action="{{ url_for('project_new') }}">

      <!-- Template chooser -->
      <div class="mb-4">
        <label class="form-label fw-semibold">Implementation Template</label>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <input type="radio" class="btn-check" name="template_type" id="tpl_optimized_activation" value="optimized_activation" checked>
            <label class="btn btn-tpl-activation w-100 h-100 text-start p-3" for="tpl_optimized_activation">
              <div class="fw-bold mb-1">⚡ Recharge Optimized Activation</div>
              <div class="small" style="color:#0129F1; opacity:0.75;">New merchant activating ReCharge for the first time.</div>
            </label>
          </div>
          <div class="col-md-4">
            <input type="radio" class="btn-check" name="template_type" id="tpl_optimized_subscription_migration" value="optimized_subscription_migration">
            <label class="btn btn-tpl-migration w-100 h-100 text-start p-3" for="tpl_optimized_subscription_migration">
              <div class="fw-bold mb-1">✨ Recharge Optimized Subscription Migration</div>
              <div class="small" style="color:#6b7a00; opacity:0.85;">Merchant migrating subscriptions from another platform.</div>
            </label>
          </div>
          <div class="col-md-4">
            <input type="radio" class="btn-check" name="template_type" id="tpl_recharge_strategic_migration" value="recharge_strategic_migration">
            <label class="btn btn-tpl-strategic w-100 h-100 text-start p-3" for="tpl_recharge_strategic_migration">
              <div class="fw-bold mb-1">🚀 Recharge Strategic Implementation</div>
              <div class="small" style="color:#c0293c; opacity:0.85;">Complex migration requiring strategic planning and phased rollout.</div>
            </label>
          </div>
        </div>
        <div class="row g-3 justify-content-center">
          <div class="col-md-4">
            <input type="radio" class="btn-check" name="template_type" id="tpl_skio" value="skio">
            <label class="btn btn-tpl-skio w-100 h-100 text-start p-3" for="tpl_skio">
              <div class="fw-bold mb-1">🐱 Skio</div>
              <div class="small" style="color:#5b21b6; opacity:0.85;">Merchant is onboarding onto Skio.</div>
            </label>
          </div>
          <div class="col-md-4">
            <input type="radio" class="btn-check" name="template_type" id="tpl_store_optimization" value="store_optimization">
            <label class="btn btn-tpl-store-optimization w-100 h-100 text-start p-3" for="tpl_store_optimization">
              <div class="fw-bold mb-1">🛍️ Store Optimization</div>
              <div class="small" style="color:#9d174d; opacity:0.85;">Cross Sell / Upsell projects.</div>
            </label>
          </div>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-header fw-semibold">Project Details</div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label">Merchant Name <span style="color:#ec4899;">*</span></label>
              <input type="text" name="merchant_name" id="merchant_name" class="form-control" placeholder="Acme Co" required>
              <input type="hidden" name="name" id="name_hidden">
            </div>
            <div class="col-md-12">
              <label class="form-label">Implementation Engineer <span style="color:#ec4899;">*</span></label>
              <select name="ie_owner" class="form-select" required>
                <option value="">— Select IE —</option>
                {% for ie in ie_owners %}
                <option value="{{ ie }}" {% if ie == session.current_user %}selected{% endif %}>{{ ie }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" id="contract_start_label">Contract Start Date <span style="color:#ec4899;">*</span></label>
              <input type="date" name="contract_start_date" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Target Go-Live Date <span style="color:#ec4899;">*</span></label>
              <input type="date" name="target_go_live_date" class="form-control" required>
              <div class="form-text" id="contract_start_help">Sets the end point for task due date distribution.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg me-1"></i>Create Project
        </button>
        <a href="{{ url_for('project_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% block scripts %}
<script>
document.querySelector('form').addEventListener('submit', function() {
  document.getElementById('name_hidden').value = document.getElementById('merchant_name').value;
});

function updateStartDateLabel() {
  const isStoreOpt = document.getElementById('tpl_store_optimization').checked;
  document.getElementById('contract_start_label').innerHTML = (isStoreOpt ? 'Project Assignment Date' : 'Contract Start Date') + ' <span style="color:#ec4899;">*</span>';
  document.getElementById('contract_start_help').textContent = isStoreOpt
    ? 'Project is considered Late if not marked Done within 40 days of this date.'
    : 'Used to calculate task due dates from the template.';
}

document.querySelectorAll('input[name="template_type"]').forEach(function(r) {
  r.addEventListener('change', updateStartDateLabel);
});
updateStartDateLabel();
</script>
{% endblock %}
{% endblock %}
